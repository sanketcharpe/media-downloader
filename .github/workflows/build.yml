name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APKs
        run: |
          ls -la app/build/outputs/apk/debug/
          cp app/build/outputs/apk/debug/app-arm64-v8a-debug.apk MediaDownloader-arm64.apk
          cp app/build/outputs/apk/debug/app-armeabi-v7a-debug.apk MediaDownloader-old-phones.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MediaDownloader-apk
          path: MediaDownloader-*.apk

      - name: Publish release (download link for the phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Media Downloader — build ${{ github.run_number }}
          files: MediaDownloader-*.apk
          make_latest: true
